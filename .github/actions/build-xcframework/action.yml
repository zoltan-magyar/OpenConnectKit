name: Build XCFramework
description: >
  Builds Frameworks/COpenConnect.xcframework with Scripts/build-xcframework.sh,
  caching the OpenSSL and openconnect builds. Package.swift picks the result up
  automatically.

runs:
  using: composite
  steps:
    - name: Read XCFramework versions
      shell: bash
      run: |
        source Scripts/xcframework.env
        echo "OPENSSL_VERSION=$OPENSSL_VERSION" >> "$GITHUB_ENV"
        echo "OPENCONNECT_VERSION=$OPENCONNECT_VERSION" >> "$GITHUB_ENV"

    - name: Install build dependencies
      shell: bash
      run: brew install autoconf automake libtool pkg-config

    # The keys include the build recipe, not just the versions: a change to
    # compiler flags or ./configure options has to rebuild, too.
    - name: Cache OpenSSL build
      uses: actions/cache@v6
      with:
        path: .build-xcframework/openssl-arm64
        key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-xcframework.sh', 'Scripts/xcframework.env') }}

    - name: Cache openconnect build
      uses: actions/cache@v6
      with:
        path: .build-xcframework/openconnect-arm64
        key: openconnect-${{ env.OPENCONNECT_VERSION }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-xcframework.sh', 'Scripts/xcframework.env') }}

    - name: Build XCFramework
      shell: bash
      run: ./Scripts/build-xcframework.sh
