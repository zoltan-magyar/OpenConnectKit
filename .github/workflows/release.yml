name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Build and release
    runs-on: xcode-27

    permissions:
      contents: write

    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: true

      - name: Validate tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "error: tag $TAG is not on main"
            exit 1
          fi

      - name: Read XCFramework versions
        run: |
          source Scripts/xcframework.env
          echo "OPENSSL_VERSION=$OPENSSL_VERSION" >> "$GITHUB_ENV"
          echo "OPENCONNECT_VERSION=$OPENCONNECT_VERSION" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Cache OpenSSL build
        uses: actions/cache@v6
        with:
          path: .build-xcframework/openssl-arm64
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.arch }}

      - name: Cache openconnect build
        uses: actions/cache@v6
        with:
          path: .build-xcframework/openconnect-arm64
          key: openconnect-${{ env.OPENCONNECT_VERSION }}-${{ runner.arch }}

      - name: Build XCFramework
        run: ./Scripts/build-xcframework.sh

      - name: Package XCFramework
        run: |
          cd Frameworks
          zip -r ../OpenConnectC.xcframework.zip OpenConnectC.xcframework

      - name: Compute checksum
        id: checksum
        run: |
          echo "value=$(swift package compute-checksum OpenConnectC.xcframework.zip)" >> $GITHUB_OUTPUT

      - name: Update Package.swift
        env:
          CHECKSUM: ${{ steps.checksum.outputs.value }}
        run: |
          URL="https://github.com/${REPO}/releases/download/${TAG}/OpenConnectC.xcframework.zip"
          # Replaces the string literals of `releaseURL` and `releaseChecksum`.
          sed -i '' -E \
            -e "s|\"https://github.com/[^\"]+/releases/download/[^\"]+\"|\"${URL}\"|" \
            -e "s|^let releaseChecksum = \"[0-9a-f]+\"|let releaseChecksum = \"${CHECKSUM}\"|" \
            Package.swift
          grep -qF "\"${URL}\"" Package.swift || { echo "error: releaseURL not updated"; exit 1; }
          grep -qF "\"${CHECKSUM}\"" Package.swift || { echo "error: releaseChecksum not updated"; exit 1; }

      - name: Commit and move tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git add Package.swift
          git commit -m "Release $TAG"
          git push origin HEAD:main
          git tag -f "$TAG"
          git push origin -f "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "OpenConnectC.xcframework.zip#OpenConnectC.xcframework.zip"
