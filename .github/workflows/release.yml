name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Build and release
    runs-on: xcode-27

    permissions:
      contents: write

    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: true

      - name: Validate tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "error: tag $TAG is not on main"
            exit 1
          fi

      - name: Build XCFramework
        uses: ./.github/actions/build-xcframework

      - name: Package XCFramework
        run: |
          cd Frameworks
          zip -r ../OpenConnectC.xcframework.zip OpenConnectC.xcframework

      - name: Compute checksum
        id: checksum
        run: |
          echo "value=$(swift package compute-checksum OpenConnectC.xcframework.zip)" >> $GITHUB_OUTPUT

      # The release starts as a draft and is only published at the end, after
      # Package.swift and the tag are final: with immutable releases, publishing
      # locks the release's files and its tag. The draft already holds the zip,
      # so Package.swift on main never points at a file that was never uploaded.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="OpenConnectC.xcframework.zip#OpenConnectC.xcframework.zip"
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            # Left over from a failed run: replace the zip with this build's.
            gh release upload "$TAG" "$ASSET" --clobber
          elif gh release view "$TAG" > /dev/null 2>&1; then
            echo "error: release $TAG is already published. Create releases by pushing"
            echo "a tag; this workflow writes the notes and publishes the release itself."
            exit 1
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes "$ASSET"
          fi

      - name: Update Package.swift
        env:
          CHECKSUM: ${{ steps.checksum.outputs.value }}
        run: |
          URL="https://github.com/${REPO}/releases/download/${TAG}/OpenConnectC.xcframework.zip"
          # Replaces the string literals of `releaseURL` and `releaseChecksum`.
          sed -i '' -E \
            -e "s|\"https://github.com/[^\"]+/releases/download/[^\"]+\"|\"${URL}\"|" \
            -e "s|^let releaseChecksum = \"[0-9a-f]+\"|let releaseChecksum = \"${CHECKSUM}\"|" \
            Package.swift
          grep -qF "\"${URL}\"" Package.swift || { echo "error: releaseURL not updated"; exit 1; }
          grep -qF "\"${CHECKSUM}\"" Package.swift || { echo "error: releaseChecksum not updated"; exit 1; }

      - name: Commit and move tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          # On a re-run the tag may already point at the release commit.
          if ! git diff --quiet Package.swift; then
            git add Package.swift
            git commit -m "Release $TAG"
          fi
          git push origin HEAD:main
          git tag -f "$TAG"
          git push origin -f "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false
